<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>バレーボール参加管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <header>
    <div class="header-row">
      <div class="header-leading">
        <h1>🏐参加管理</h1>
        <label class="undecided-toggle" for="showUndecidedToggle" title="場所未定の日程の表示を切り替え">
          <input type="checkbox" id="showUndecidedToggle" checked />
          <span class="undecided-toggle-ui" aria-hidden="true"></span>
          <span class="undecided-toggle-label">場所未定</span>
        </label>
      </div>
      <div class="header-actions">
        <a class="header-link-btn" id="bulkRegisterLink" href="/bulk">一括登録</a>
        <button type="button" class="refresh-btn" id="refreshCalendarBtn" title="最新データを再取得">更新</button>
      </div>
    </div>
    <p id="periodLabel" hidden></p>
  </header>

  <main>
    <div id="errorArea"></div>
    <div id="loadingArea" class="loading-panel" role="status" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>カレンダーを読み込んでいます…</p>
    </div>
    <div id="calendarArea" class="calendars" style="display:none;"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-header-top">
          <div>
            <div class="modal-title-row">
              <h2 id="modalTitle">詳細</h2>
              <span id="modalTimeSlot" class="modal-time-slot"></span>
            </div>
            <div class="meta grouped-meta" id="modalMeta"></div>
            <div id="orgDetailPanel" class="org-detail-panel" aria-live="polite"></div>
            <p id="modalScheduleRemark" class="schedule-remark" style="display:none;" hidden></p>
          </div>
          <button type="button" class="close-btn" id="closeModalBtn" aria-label="閉じる">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody">
        <p id="modalCount" style="font-weight:600;margin-top:0;"></p>
        <h3 style="font-size:0.95rem;margin:0 0 0.25rem;">参加者一覧</h3>
        <ul id="participantList" class="participant-list"></ul>
        <p id="emptyParticipants" class="empty-participants" style="display:none;">まだ登録がありません</p>
        <section id="participantRegisterSection" class="form-section">
          <h3>参加登録</h3>
          <label for="participantMemberSelect">名前</label>
          <select id="participantMemberSelect">
            <option value="">選択してください</option>
          </select>
          <div class="status-group" role="radiogroup" aria-label="参加状況">
            <label class="status-option confirmed">
              <input type="radio" name="editStatus" value="1" />
              <span>○</span>
            </label>
            <label class="status-option pending">
              <input type="radio" name="editStatus" value="2" />
              <span>△</span>
            </label>
            <label class="status-option absent">
              <input type="radio" name="editStatus" value="3" />
              <span>✕</span>
            </label>
          </div>
          <label for="editRemark">備考（任意）</label>
          <input type="text" id="editRemark" autocomplete="off" />
          <button type="button" id="saveParticipantBtn" class="submit-btn">登録</button>
        </section>
        <p id="modalFormMessage" class="form-message"></p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/participant-api.js?v=2"></script>
  <script src="js/spreadsheet-loader.js?v=2"></script>
  <script src="js/calendar-app.js?v=11"></script>
</body>
</html>
